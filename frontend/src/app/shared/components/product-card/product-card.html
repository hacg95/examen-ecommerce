<a class="product-card" [routerLink]="['/product', product().id]">
	<div class="product-card__image-wrap">
		<img [src]="product().imageUrl" [alt]="product().name" loading="lazy" />
		<span class="product-card__type">{{ product().type }}</span>
	</div>
	<div class="product-card__body">
		<div class="product-card__heading">
			<h2>{{ product().name }}</h2>
		</div>
		<div class="product-card__footer">
			<span class="product-card__price">{{ product().price | currency: product().currency }}</span>
			<span class="product-card__action">View details <span aria-hidden="true">-&gt;</span></span>
		</div>
	</div>
</a>
